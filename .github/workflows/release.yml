name: Release

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview Hooversion without release commits, tags, releases, or images
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

env:
  BUN_VERSION: 1.3.14
  GO_VERSION: 1.26.6
  HOOVERSION_VERSION: 1.0.7
  GHCR_IMAGE: ghcr.io/${{ github.repository }}
  DOCKERHUB_IMAGE: openhoo/hoomail
  IMAGE_CANDIDATE_TAG: cand-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  release:
    name: Hooversion Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      current: ${{ steps.current.outputs.current || steps.manual_current.outputs.current }}
      published: ${{ steps.metadata.outputs.published }}
      short_sha: ${{ steps.metadata.outputs.short_sha }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main

      - name: Verify release run matches current main
        id: current
        if: github.event_name == 'workflow_run'
        env:
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" = "$EXPECTED_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping stale release run for $EXPECTED_SHA because main is $actual."
          fi

      - name: Verify manual publication prerequisites
        id: manual_prerequisite
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD)"
          current_main_sha="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            --jq '.object.sha')"
          if [ "$checked_out_sha" != "$current_main_sha" ]; then
            echo "::error::Manual publication checkout is stale: checkout=$checked_out_sha main=$current_main_sha. Re-run against current main."
            exit 1
          fi

          version="$(tr -d '[:space:]' < internal/version/version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::internal/version/version contains invalid release version '$version'."
            exit 1
          fi
          tag="v${version}"
          subject="$(git log -1 --format=%s HEAD)"
          expected_subject="chore(release): hoomail ${version}"
          resume=false
          ci_sha="$checked_out_sha"
          if [ "$subject" = "$expected_subject" ]; then
            git fetch --force origin main 'refs/tags/v*:refs/tags/v*'
            tag_commit="$(git rev-parse "${tag}^{commit}" 2>/dev/null || true)"
            if [ -z "$tag_commit" ]; then
              echo "::error::Existing release commit has subject '$subject', but tag $tag is missing from origin."
              exit 1
            fi
            if [ "$tag_commit" != "$checked_out_sha" ]; then
              echo "::error::Existing release retry requires tag $tag to point to current main $checked_out_sha, but it points to $tag_commit."
              exit 1
            fi
            ci_sha="$(git rev-parse HEAD^)"
            resume=true
            echo "::notice::Recognized existing release $tag at $checked_out_sha; validating CI for first parent $ci_sha."
          fi

          successful_runs="$(gh api --method GET \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$ci_sha" \
            -f status=success \
            -f per_page=1 \
            --jq '.total_count')"
          if [ "$successful_runs" -eq 0 ]; then
            if [ "$resume" = true ]; then
              echo "::error::Release resume requires a successful push CI workflow run for first parent SHA $ci_sha."
            else
              echo "::error::Manual publication requires a successful push CI workflow run for current main SHA $ci_sha."
            fi
            exit 1
          fi
          {
            echo "resume=$resume"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Mark manual release current
        id: manual_current
        if: github.event_name == 'workflow_dispatch'
        run: echo "current=true" >> "$GITHUB_OUTPUT"

      - name: Set up Bun
        if: >-
          (steps.current.outputs.current == 'true' || steps.manual_current.outputs.current == 'true') &&
          steps.manual_prerequisite.outputs.resume != 'true'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Go
        if: >-
          (steps.current.outputs.current == 'true' || steps.manual_current.outputs.current == 'true') &&
          steps.manual_prerequisite.outputs.resume != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Prepare protected-branch release
        id: prepare_release
        if: >-
          (steps.current.outputs.current == 'true' || steps.manual_current.outputs.current == 'true') &&
          steps.manual_prerequisite.outputs.resume != 'true' &&
          (github.event_name == 'workflow_dispatch' || !startsWith(github.event.workflow_run.head_commit.message, 'chore(release):'))
        uses: openhoo/hooversion/actions/prepare-release@d536bb45b5c2dbf9a17c866c0fe48f54216a1673 # v1.0.7
        with:
          version: ${{ env.HOOVERSION_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

      - name: Finalize protected-branch release
        id: release
        if: >-
          steps.current.outputs.current == 'true' &&
          startsWith(github.event.workflow_run.head_commit.message, 'chore(release):')
        uses: openhoo/hooversion/actions/release@d536bb45b5c2dbf9a17c866c0fe48f54216a1673 # v1.0.7
        with:
          version: ${{ env.HOOVERSION_VERSION }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github: false

      - name: Resolve publication metadata
        id: metadata
        if: steps.current.outputs.current == 'true' || steps.manual_current.outputs.current == 'true'
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          HOOVERSION_PUBLISHED: ${{ steps.release.outputs.published }}
          HOOVERSION_TAG: ${{ steps.release.outputs.tag || steps.prepare_release.outputs.tag }}
          HOOVERSION_VERSION: ${{ steps.release.outputs.version || steps.prepare_release.outputs.version }}
          MANUAL_RESUME: ${{ steps.manual_prerequisite.outputs.resume }}
          MANUAL_RESUME_TAG: ${{ steps.manual_prerequisite.outputs.tag }}
          MANUAL_RESUME_VERSION: ${{ steps.manual_prerequisite.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            {
              echo "published=false"
              echo "tag=${HOOVERSION_TAG:-}"
              echo "version=${HOOVERSION_VERSION:-}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$MANUAL_RESUME" = "true" ]; then
            {
              echo "published=true"
              echo "tag=$MANUAL_RESUME_TAG"
              echo "version=$MANUAL_RESUME_VERSION"
            } >> "$GITHUB_OUTPUT"
            commit="$(git rev-parse "${MANUAL_RESUME_TAG}^{commit}")"
            {
              echo "commit=$commit"
              echo "short_sha=${commit:0:7}"
            } >> "$GITHUB_OUTPUT"
            echo "Resuming publication for $MANUAL_RESUME_TAG at $commit."
            exit 0
          fi
          if [ "$HOOVERSION_PUBLISHED" != "true" ]; then
            {
              echo "published=false"
              echo "tag=${HOOVERSION_TAG:-}"
              echo "version=${HOOVERSION_VERSION:-}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="$(tr -d '[:space:]' < internal/version/version)"
          if [ "${HOOVERSION_VERSION:-}" != "$version" ]; then
            echo "::error::Hooversion published version '${HOOVERSION_VERSION:-}' but internal/version/version contains '$version'."
            exit 1
          fi
          tag="v${version}"
          if [ "${HOOVERSION_TAG:-}" != "$tag" ]; then
            echo "::error::Hooversion published tag '${HOOVERSION_TAG:-}' but expected '$tag'."
            exit 1
          fi
          commit="$(git rev-parse "${tag}^{commit}")"
          subject="$(git log -1 --format=%s "$commit")"
          expected_subject="chore(release): hoomail ${version}"
          if [ "$subject" != "$expected_subject" ]; then
            echo "::error::Hooversion tag $tag points to commit with unexpected subject '$subject'."
            exit 1
          fi
          {
            echo "published=true"
            echo "commit=$commit"
            echo "short_sha=${commit:0:7}"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  publish-chart:
    name: Package Helm chart
    needs: release
    if: needs.release.outputs.current == 'true' && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Package chart
        run: |
          set -euo pipefail
          install -m 0644 LICENSE charts/hoomail/LICENSE
          helm package charts/hoomail --destination dist
          chart=(dist/*.tgz)
          test "${#chart[@]}" -eq 1
          tar -tzf "${chart[0]}" | grep -Fx 'hoomail/LICENSE'

      - name: Upload packaged chart
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chart-${{ needs.release.outputs.tag }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish-image:
    name: Publish images
    needs: release
    if: needs.release.outputs.current == 'true' && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive candidate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=${{ env.IMAGE_CANDIDATE_TAG }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.revision=${{ needs.release.outputs.commit }}
            org.opencontainers.image.version=${{ needs.release.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push candidate image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          build-args: VERSION=${{ needs.release.outputs.version }}
          cache-from: type=gha,scope=hoomail-image
          cache-to: type=gha,mode=max,scope=hoomail-image
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,compression=zstd,compression-level=19,force-compression=true
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Verify compressed platform images
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
          MAX_COMPRESSED_SIZE: "6291456"
        run: |
          set -euo pipefail
          mapfile -t platforms < <(
            docker buildx imagetools inspect --raw "${GHCR_IMAGE}@${INDEX_DIGEST}" |
              jq -r '.manifests[] | select(.platform.os == "linux") | "\(.platform.os)/\(.platform.architecture)"' |
              sort
          )
          expected=(linux/amd64 linux/arm64)
          test "${platforms[*]}" = "${expected[*]}"

          mapfile -t manifests < <(
            docker buildx imagetools inspect --raw "${GHCR_IMAGE}@${INDEX_DIGEST}" |
              jq -r '.manifests[] | select(.platform.os == "linux") | .digest'
          )
          test "${#manifests[@]}" -eq 2
          test "${manifests[0]}" != "${manifests[1]}"
          for manifest in "${manifests[@]}"; do
            details="$(docker buildx imagetools inspect --raw "${GHCR_IMAGE}@${manifest}")"
            jq -e 'all(.layers[]; .mediaType == "application/vnd.oci.image.layer.v1.tar+zstd")' <<<"${details}"
            size="$(jq '[.layers[].size] | add' <<<"${details}")"
            test "${size}" -le "${MAX_COMPRESSED_SIZE}"
          done
          docker buildx imagetools inspect "${DOCKERHUB_IMAGE}@${INDEX_DIGEST}" > /dev/null

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image digests
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"
          cosign sign --yes "${DOCKERHUB_IMAGE}@${DIGEST}"

      - name: Promote verified image digest
        env:
          GHCR_IMAGE: ${{ env.GHCR_IMAGE }}
          DOCKERHUB_IMAGE: ${{ env.DOCKERHUB_IMAGE }}
          INDEX_DIGEST: ${{ steps.push.outputs.digest }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_SHORT_SHA: ${{ needs.release.outputs.short_sha }}
        run: |
          set -euo pipefail
          minor="${RELEASE_VERSION%.*}"
          for image in "$GHCR_IMAGE" "$DOCKERHUB_IMAGE"; do
            for tag in "$RELEASE_VERSION" "$minor" "sha-${RELEASE_SHORT_SHA}" latest; do
              docker buildx imagetools create \
                --tag "${image}:${tag}" \
                "${image}@${INDEX_DIGEST}"
            done
          done

      - name: Update Docker Hub repository information
        continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.DOCKERHUB_IMAGE }}
          short-description: Small, self-hosted SMTP/POP3 email testing server with a real-time web inbox and offline inspection.
          enable-url-completion: true

  publish-release:
    name: Publish GitHub Release
    needs:
      - release
      - publish-chart
      - publish-image
    if: needs.release.outputs.current == 'true' && needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download packaged chart
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: chart-${{ needs.release.outputs.tag }}
          path: dist

      - name: Generate checksums
        run: cd dist && sha256sum -- *.tgz | sort -k2 > SHA256SUMS

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign release assets
        run: |
          set -euo pipefail
          for artifact in dist/*.tgz dist/SHA256SUMS; do
            cosign sign-blob "$artifact" --bundle "${artifact}.sigstore.json" --yes
          done

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          charts=(dist/*.tgz)
          test "${#charts[@]}" -eq 1
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "hoomail ${RELEASE_VERSION}" \
              --generate-notes
          fi
