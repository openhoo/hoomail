name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: 1.3.14
  GO_VERSION: 1.26.6
  HOOVERSION_VERSION: 1.0.7

jobs:
  commitlint:
    name: Conventional Commits
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lint commits
        uses: openhoo/hooversion/actions/lint@d536bb45b5c2dbf9a17c866c0fe48f54216a1673 # v1.0.7
        with:
          version: ${{ env.HOOVERSION_VERSION }}

  e2e:
    name: Playwright E2E
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      - name: Derive E2E ports
        run: |
          set -euo pipefail
          base=$((16384 + (((GITHUB_RUN_ID * 2 + GITHUB_RUN_ATTEMPT) % 7000) * 2)))
          {
            echo "HOOMAIL_E2E_HTTP_PORT=$base"
            echo "HOOMAIL_E2E_SMTP_PORT=$((base + 1))"
            echo "HOOMAIL_E2E_POP3_PORT=$((base + 2))"
          } >> "$GITHUB_ENV"

      - name: Test
        run: bun run test:e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  client:
    name: Preact client
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun x tsc --noEmit

      - name: Build
        run: bun run build

  go-test:
    name: Go race tests and coverage
    needs: commitlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      code-quality: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build embedded client
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Test with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: Convert coverage to Cobertura
        run: go run github.com/boumenot/gocover-cobertura@v1.5.0 -strict < coverage.out > coverage.xml

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@d8e329117199404bba6fc81efe8093dc7c015e34 # v1.4.2
        with:
          file: coverage.xml
          language: Go
          label: code-coverage/go

  go-quality:
    name: Go quality
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build embedded client
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal web third_party/go-smtp)"

      - name: Vet
        run: go vet ./...

      - name: Verify modules
        run: go mod verify

      - name: Verify vendored SMTP module
        working-directory: third_party/go-smtp
        run: |
          go mod verify
          go vet ./...
          go test ./...

  go-security:
    name: Go security
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Build embedded client
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Scan vendored SMTP module vulnerabilities
        working-directory: third_party/go-smtp
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Scan Go security patterns
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0 -quiet -exclude=G104,G202,G301,G705 ./...
  helm:
    name: Helm chart
    needs: commitlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.3

      - name: Lint chart
        run: helm lint --strict charts/hoomail

      - name: Render chart variants
        run: |
          set -euo pipefail
          helm template hoomail charts/hoomail > /dev/null
          helm template hoomail charts/hoomail \
            --set image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set persistence.enabled=false \
            --set ingress.enabled=true \
            --set ingress.className=nginx > /dev/null
          helm template hoomail charts/hoomail \
            --set persistence.existingClaim=hoomail-data \
            --set serviceAccount.create=true \
            --set serviceAccount.name=hoomail > /dev/null

      - name: Verify release version synchronization
        run: |
          set -euo pipefail
          release_version="$(tr -d '\r\n' < internal/version/version)"
          test "$(sed -n 's/^version: //p' charts/hoomail/Chart.yaml)" = "$release_version"
          test "$(sed -n 's/^appVersion: "\(.*\)"/\1/p' charts/hoomail/Chart.yaml)" = "$release_version"
          test "$(grep -Fc "ghcr.io/openhoo/hoomail:$release_version" README.md)" -eq 2

  docker:
    name: Docker build and smoke
    needs:
      - client
      - e2e
      - go-quality
      - go-security
      - go-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0


      - name: Build image
        run: |
          docker buildx build \
            --build-arg VERSION=0.0.0-ci \
            --cache-from type=gha,scope=hoomail-image \
            --cache-to type=gha,mode=max,scope=hoomail-image \
            --load \
            --tag hoomail:ci \
            .

      - name: Verify embedded version
        run: test "$(docker run --rm hoomail:ci version)" = "0.0.0-ci"

      - name: Smoke HTTP and SMTP
        run: |
          set -euo pipefail
          docker run --rm -d --name hoomail-ci \
            --tmpfs /app/data:rw,noexec,nosuid,uid=65532,gid=65532,size=64m \
            -p 3000:3000 -p 2525:2525 -p 3110:3110 hoomail:ci
          for _ in $(seq 1 30); do
            if docker exec hoomail-ci /hoomail healthcheck; then
              exit 0
            fi
            sleep 1
          done
          docker logs hoomail-ci
          exit 1

      - name: Verify bundled third-party notices
        run: |
          set -euo pipefail
          docker cp hoomail-ci:/licenses/LICENSE.mailpit "$RUNNER_TEMP/LICENSE.mailpit"
          docker cp hoomail-ci:/licenses/LICENSE.can-i-email "$RUNNER_TEMP/LICENSE.can-i-email"
          cmp internal/inspect/LICENSE.mailpit "$RUNNER_TEMP/LICENSE.mailpit"
          cmp internal/inspect/LICENSE.can-i-email "$RUNNER_TEMP/LICENSE.can-i-email"

      - name: Remove CI container and image
        if: always()
        run: |
          docker rm -f hoomail-ci 2>/dev/null || true
          docker image rm hoomail:ci 2>/dev/null || true

  policy:
    name: Hoostack policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Enforce Hoolicy policy
        uses: openhoo/hoolicy/actions/check@f1b9be32483e3353e38ef3b5703217d2723e735e # v0.2.4
        with:
          version: 0.2.4

      - name: Scan with Hooray
        uses: openhoo/hooray/actions/scan@5446c51a79d115048601d3f42d6a9127b49fb322 # v0.6.3
        with:
          version: 0.6.3
          policy: hooray-policy.yaml
          format: table
          output: ""

      - name: Analyze with Hoonarqube
        uses: openhoo/hoonarqube/actions/analyze@0ed50de75e6e8c097c44e6b50a16f6d8817acedf # v0.2.3
        with:
          version: 0.2.3
          paths: |
            app
            cmd
            components
            e2e
            internal
            lib
            web
          output: ${{ runner.temp }}/hoonarqube.json
          fail-on: none

      - name: Set up HooNeedsUpdates
        uses: openhoo/hooneedsupdates/actions/setup@4a833fd00dafc8fb017d5cabec0c38dddba4bc70 # v0.1.1
        with:
          version: 0.1.1

      - name: Audit dependency freshness
        run: hooneedsupdates scan --fail-on unresolved .
        env:
          GITHUB_TOKEN: ${{ github.token }}
