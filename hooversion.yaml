branches:
  - main
packages:
  - name: hoomail
    path: .
    type: version-file
    manifest: internal/version/version
    changelog: CHANGELOG.md
    scopes:
      - hoomail
      - client
      - server
      - smtp
      - docker
      - ghcr
      - image
      - helm
      - chart
      - release
    assets:
      - internal/inspect/LICENSE.mailpit
      - internal/inspect/LICENSE.can-i-email
hooks:
  afterVersion:
    - bun scripts/sync-chart-version.ts
    - go generate ./internal/httpserver
github:
  releases: true
